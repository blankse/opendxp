services:
    _defaults:
        autowire: true
        autoconfigure: true

    #
    # ROUTING
    #

    # route provider for the CMF dynamic router
    OpenDxp\Routing\DynamicRouteProvider:
        calls:
            - [addHandler, ['@OpenDxp\Routing\Dynamic\DocumentRouteHandler']]
            - [addHandler, ['@OpenDxp\Routing\Dynamic\DataObjectRouteHandler']]

    # specific document related dynamic routing handling
    OpenDxp\Routing\Dynamic\DocumentRouteHandler: ~

    # specific data object url slug related dynamic routing handling
    OpenDxp\Routing\Dynamic\DataObjectRouteHandler: ~

    # alias the request context as public service
    opendxp.routing.router.request_context:
        alias: router.request_context
        public: true

    # dedicated router for elements
    OpenDxp\Routing\Element\Router:
        arguments:
            $context: '@router.request_context'
        tags:
            - { name: router, priority: 110 }

    # routing loader for bundle routing auto loading
    OpenDxp\Routing\Loader\BundleRoutingLoader:
        tags:
            - { name: routing.loader }
