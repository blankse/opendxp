services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

    # Example custom templating helper
    # AppBundle\Templating\Helper\Example:
    #     # templating helpers need to be public as they
    #     # are fetched from the container on demand
    #     public: true
    #     tags:
    #         - { name: templating.helper, alias: fooBar }

    # Example event listener for objects
    # AppBundle\EventListener\TestListener:
    #     tags:
    #         - { name: kernel.event_listener, event: opendxp.dataobject.preUpdate, method: onObjectPreUpdate }

    OpenDxp\Model\Version\Adapter\VersionStorageAdapterInterface:
        public: true
        alias: OpenDxp\Model\Version\Adapter\ProxyVersionStorageAdapter

    OpenDxp\Model\Version\Adapter\ProxyVersionStorageAdapter: ~
